name: Deploy (manual only)

# ─────────────────────────────────────────────────────────────────────────────
# This workflow has NO automatic trigger. There is no `push:` here on purpose:
# it runs only when a person opens the Actions tab and presses Run workflow.
#
# ⚠️  ONE THING CAN STILL DEPLOY BEHIND YOUR BACK
# If the repository is connected to Vercel through Vercel's own Git
# integration, Vercel deploys on every push regardless of this file. To keep
# deployment manual you must ALSO do one of:
#   • not connect the repo in the Vercel dashboard at all (deploy only from
#     here, using the token below), or
#   • connect it, then Vercel → Project → Settings → Git → turn OFF
#     "Automatic deployments from Git".
# Without that, this workflow is theatre.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy'
        required: true
        default: web
        type: choice
        options: [web, pg]
      target:
        description: 'Deploy target'
        required: true
        default: preview
        type: choice
        options: [preview, production]
      confirm:
        description: 'For production only: type DEPLOY to confirm'
        required: false
        default: ''
      reason:
        description: 'Why are you deploying? (recorded in the run log)'
        required: true
        default: ''

concurrency:
  group: deploy-${{ inputs.app }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  guard:
    name: Check authorisation
    runs-on: ubuntu-latest
    steps:
      - name: Require typed confirmation for production
        if: inputs.target == 'production'
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Production deploy needs the confirm box set to exactly DEPLOY."
            exit 1
          fi
      - name: Record intent
        run: |
          echo "App    : ${{ inputs.app }}"           >> "$GITHUB_STEP_SUMMARY"
          echo "Target : ${{ inputs.target }}"        >> "$GITHUB_STEP_SUMMARY"
          echo "By     : ${{ github.actor }}"         >> "$GITHUB_STEP_SUMMARY"
          echo "Commit : ${{ github.sha }}"           >> "$GITHUB_STEP_SUMMARY"
          echo "Reason : ${{ inputs.reason }}"        >> "$GITHUB_STEP_SUMMARY"

  # Never deploy something that does not pass its tests, even by hand.
  verify:
    name: Tests must pass first
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    name: Deploy ${{ inputs.app }} to ${{ inputs.target }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two apps, two Vercel projects, ONE workflow. The project id is picked by
    # the app input; the student app and the scanner deploy independently —
    # that separation is what lets the PG app freeze at 07:00 on event day
    # while the student app can still be hotfixed at 10:30.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ inputs.app == 'web' && secrets.VERCEL_PROJECT_ID_WEB || secrets.VERCEL_PROJECT_ID_PG }}
      # No APP_DIR / --cwd on purpose. In an npm-workspaces monorepo the
      # dependencies hoist to the repo ROOT, so running the Vercel CLI from
      # inside apps/<app> makes it look for node_modules one level too deep
      # and fail with "Please ensure project dependencies have been
      # installed". Each Vercel project instead carries Root Directory =
      # apps/<app>; vercel pull downloads that setting and the CLI builds
      # the right app from the repo root.
    steps:
      - uses: actions/checkout@v7

      - name: Check required secrets exist
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ]      && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ]     && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID_${{ inputs.app == 'web' && 'WEB' || 'PG' }}"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "Until the Vercel project exists this workflow cannot deploy —"
            echo "that is expected, not a broken pipeline."
            exit 1
          fi

          # Shape check. ORG_ID and PROJECT_ID are IDENTIFIERS, not credentials
          # (the token is the credential), so echoing their prefix is safe — and
          # it turns Vercel's opaque "Project not found" into a named mistake.
          # Pasting the team slug or the project NAME instead of the id is the
          # single most common setup error.
          echo "CHANDOAN org_prefix=${VERCEL_ORG_ID:0:5} org_len=${#VERCEL_ORG_ID} prj_prefix=${VERCEL_PROJECT_ID:0:4} prj_len=${#VERCEL_PROJECT_ID}"
          bad=0
          case "$VERCEL_ORG_ID" in
            team_*) ;;
            *) echo "::error::VERCEL_ORG_ID phải bắt đầu bằng 'team_' — bạn đang dán slug (tcm17) hoặc tên team (TCM)?"; bad=1 ;;
          esac
          case "$VERCEL_PROJECT_ID" in
            prj_*) ;;
            *) echo "::error::VERCEL_PROJECT_ID phải bắt đầu bằng 'prj_' — bạn đang dán tên project (atl2026-web)?"; bad=1 ;;
          esac
          [ "$bad" = "1" ] && exit 1 || true

          # Trim invisible characters. A secret pasted with a trailing newline
          # still passes every shape check above, then fails deep inside Vercel
          # as an opaque "Project not found" — the value looks right in every
          # log because the newline is invisible. Re-export the cleaned values
          # so every later step uses them.
          clean_org=$(printf '%s' "$VERCEL_ORG_ID" | tr -d '[:space:]')
          clean_prj=$(printf '%s' "$VERCEL_PROJECT_ID" | tr -d '[:space:]')
          if [ "${#clean_org}" != "${#VERCEL_ORG_ID}" ] || [ "${#clean_prj}" != "${#VERCEL_PROJECT_ID}" ]; then
            echo "⚠️ Đã cắt ký tự thừa: ORG ${#VERCEL_ORG_ID}→${#clean_org}, PRJ ${#VERCEL_PROJECT_ID}→${#clean_prj}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "VERCEL_ORG_ID=$clean_org" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=$clean_prj" >> "$GITHUB_ENV"

          # Ask Vercel directly what this token can see. If the project is not
          # in the list, the token is scoped to the wrong account — the one
          # failure mode the id checks above cannot detect.
          echo "CHANDOAN --- token nhìn thấy gì ---"
          curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v9/projects?teamId=$clean_org&limit=20" \
            -o /tmp/prj.json || true
          grep -oE '"id":"prj_[^"]*"|"name":"atl[^"]*"' /tmp/prj.json | sed 's/^/CHANDOAN /' | head -20 || true
          echo "CHANDOAN secret_prj_dau=${clean_prj:0:12} len=${#clean_prj}"
          echo "CHANDOAN --- token thuộc về ai ---"
          curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v2/user" -o /tmp/user.json || true
          grep -oE '"username":"[^"]*"' /tmp/user.json | sed 's/^/CHANDOAN /' || true

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Pull Vercel environment
        run: |
          npx vercel pull --yes \
            --environment=${{ inputs.target == 'production' && 'production' || 'preview' }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: |
          npx vercel build \
            ${{ inputs.target == 'production' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(npx vercel deploy --prebuilt \
            ${{ inputs.target == 'production' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke check the deployment
        run: |
          url="${{ steps.deploy.outputs.url }}"
          # web has a public JSON endpoint; the pg app's API routes are
          # device-authed, so its liveness check is the app shell itself.
          if [ "${{ inputs.app }}" = "web" ]; then path="/api/refdata"; else path="/"; fi
          code=$(curl -s -L -o /dev/null -w '%{http_code}' "$url$path")
          echo "GET $path -> $code" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "200" ]; then
            echo "::error::Deployment is up but $path returned $code"
            exit 1
          fi
