name: Deploy (manual only)

# ─────────────────────────────────────────────────────────────────────────────
# This workflow has NO automatic trigger. There is no `push:` here on purpose:
# it runs only when a person opens the Actions tab and presses Run workflow.
#
# ⚠️  ONE THING CAN STILL DEPLOY BEHIND YOUR BACK
# If the repository is connected to Vercel through Vercel's own Git
# integration, Vercel deploys on every push regardless of this file. To keep
# deployment manual you must ALSO do one of:
#   • not connect the repo in the Vercel dashboard at all (deploy only from
#     here, using the token below), or
#   • connect it, then Vercel → Project → Settings → Git → turn OFF
#     "Automatic deployments from Git".
# Without that, this workflow is theatre.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy'
        required: true
        default: web
        type: choice
        options: [web, pg]
      target:
        description: 'Deploy target'
        required: true
        default: preview
        type: choice
        options: [preview, production]
      confirm:
        description: 'For production only: type DEPLOY to confirm'
        required: false
        default: ''
      reason:
        description: 'Why are you deploying? (recorded in the run log)'
        required: true
        default: ''

concurrency:
  group: deploy-${{ inputs.app }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  guard:
    name: Check authorisation
    runs-on: ubuntu-latest
    steps:
      - name: Require typed confirmation for production
        if: inputs.target == 'production'
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Production deploy needs the confirm box set to exactly DEPLOY."
            exit 1
          fi
      - name: Record intent
        run: |
          echo "App    : ${{ inputs.app }}"           >> "$GITHUB_STEP_SUMMARY"
          echo "Target : ${{ inputs.target }}"        >> "$GITHUB_STEP_SUMMARY"
          echo "By     : ${{ github.actor }}"         >> "$GITHUB_STEP_SUMMARY"
          echo "Commit : ${{ github.sha }}"           >> "$GITHUB_STEP_SUMMARY"
          echo "Reason : ${{ inputs.reason }}"        >> "$GITHUB_STEP_SUMMARY"

  # Never deploy something that does not pass its tests, even by hand.
  verify:
    name: Tests must pass first
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    name: Deploy ${{ inputs.app }} to ${{ inputs.target }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two apps, two Vercel projects, ONE workflow. The project id is picked by
    # the app input; the student app and the scanner deploy independently —
    # that separation is what lets the PG app freeze at 07:00 on event day
    # while the student app can still be hotfixed at 10:30.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ inputs.app == 'web' && secrets.VERCEL_PROJECT_ID_WEB || secrets.VERCEL_PROJECT_ID_PG }}
      APP_DIR: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@v7

      - name: Check required secrets exist
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ]      && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ]     && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID_${{ inputs.app == 'web' && 'WEB' || 'PG' }}"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "Until the Vercel project exists this workflow cannot deploy —"
            echo "that is expected, not a broken pipeline."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Pull Vercel environment
        run: |
          npx vercel pull --yes --cwd "$APP_DIR" \
            --environment=${{ inputs.target == 'production' && 'production' || 'preview' }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: |
          npx vercel build --cwd "$APP_DIR" \
            ${{ inputs.target == 'production' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(npx vercel deploy --prebuilt --cwd "$APP_DIR" \
            ${{ inputs.target == 'production' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke check the deployment
        run: |
          url="${{ steps.deploy.outputs.url }}"
          # web has a public JSON endpoint; the pg app's API routes are
          # device-authed, so its liveness check is the app shell itself.
          if [ "${{ inputs.app }}" = "web" ]; then path="/api/refdata"; else path="/"; fi
          code=$(curl -s -L -o /dev/null -w '%{http_code}' "$url$path")
          echo "GET $path -> $code" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "200" ]; then
            echo "::error::Deployment is up but $path returned $code"
            exit 1
          fi
